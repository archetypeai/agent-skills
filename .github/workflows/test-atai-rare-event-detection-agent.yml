name: Test atai-rare-event-detection-agent

on:
  pull_request:
    paths:
      - 'skills/atai-rare-event-detection-agent/**'
      - '.github/workflows/test-atai-rare-event-detection-agent.yml'
  push:
    branches: [main]
    paths:
      - 'skills/atai-rare-event-detection-agent/**'
      - '.github/workflows/test-atai-rare-event-detection-agent.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Path 1 needs the official client, Path 2 numpy and pandas; pytest runs the tests (unittest or pytest style)
        run: |
          python -m pip install --upgrade pip
          pip install -r skills/atai-rare-event-detection-agent/references/requirements.txt -r skills/atai-rare-event-detection-agent/references/red_lifecycle/requirements.txt pytest

      - name: Run the network-free tests
        run: python -m pytest skills/atai-rare-event-detection-agent/tests -v
