name: Omega Embeddings + Channel Stats
description: >
  Custom Omega-based blueprint. Validates and cleans windows, then tees each
  window to the Omega encoder and to per-channel summary statistics, and joins
  both into one row per window. No trained head, so it runs without optimize.

values:
  # --- Inputs ---
  timestamp_column: null
  data_columns: null

  # --- Window (canonical OSM: 1024 / 256) ---
  window_size: 256
  step_size: 128

  # --- Data preparation ---
  stream_interpolation_max_gap: 0
  window_interpolation_max_gap: 8
  interpolation_method: ffill

  # --- Validations ---
  validate_monotonic_timestamps: true
  sample_rate_interval_tolerance: 0.10
  max_temporal_gap: 0.05
  max_nan_gap: 8
  max_inf: 0
  min_value: null
  max_value: null

  # --- Features ---
  feature_names: [mean, std, slope]

models:
  encoder: "newton-omega-1-5-safetensors"

connectors:
  source:
    key: RecordsSource
    config:
      format: csv
      timestamp_column: ${values.timestamp_column}
      data_columns: [{ dtype: f32, names: "${values.data_columns}" }]
  sink:
    key: RecordsSink
    config:
      format: jsonl

nodes:
  interpolate:
    key: ValueInterpolationNode
    config:
      max_gap: ${values.stream_interpolation_max_gap}
      method: ${values.interpolation_method}

  window:
    key: WindowingNode
    config:
      window_size: ${values.window_size}
      step_size: ${values.step_size}

  windowInterpolate:
    key: InWindowsInterpolationNode
    config:
      max_gap: ${values.window_interpolation_max_gap}
      method: ${values.interpolation_method}

  samplingRate:
    key: SamplingRateValidationNode
    config:
      validate_monotonic_timestamps: ${values.validate_monotonic_timestamps}
      sample_rate_interval_tolerance: ${values.sample_rate_interval_tolerance}
      max_temporal_gap: ${values.max_temporal_gap}

  limitValues:
    key: LimitValuesValidationNode
    config:
      max_nan_gap: ${values.max_nan_gap}
      max_inf: ${values.max_inf}
      min_value: ${values.min_value}
      max_value: ${values.max_value}

  tee:
    key: TeeNode
    config:
      ports: [emb, feat]

  encoder:
    key: OmegaEncoderNode
    config:
      model: ${models.encoder}

  features:
    key: ChannelFeaturesNode
    config:
      features: ${values.feature_names}

  fuse:
    key: ConcatColumnsNode
    config:
      ports: [emb, feat]

graph:
  edges:
    - { from: source.out, to: interpolate.in }
    - { from: interpolate.out, to: window.in }
    - { from: window.out, to: windowInterpolate.in }
    - { from: windowInterpolate.out, to: samplingRate.in }
    - { from: samplingRate.out, to: limitValues.in }
    - { from: limitValues.out, to: tee.in }
    - { from: tee.emb, to: encoder.in }
    - { from: tee.feat, to: features.in }
    - { from: encoder.out, to: fuse.emb }
    - { from: features.out, to: fuse.feat }
    - { from: fuse.out, to: sink.in }
