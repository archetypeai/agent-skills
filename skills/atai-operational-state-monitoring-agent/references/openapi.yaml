openapi: 3.1.0
info:
  title: agent_service_backend
  description: ''
  license:
    name: ''
  version: 0.1.0
paths:
  /agents/blueprints:
    get:
      tags:
      - blueprints
      operationId: list_blueprints
      parameters:
      - name: limit
        in: query
        description: Max entries to return (default 20, capped at 100).
        required: false
        schema:
          type: integer
          format: int64
      - name: after
        in: query
        description: |-
          Cursor: return blueprints older than the one with this id. Pass the id of
          the last blueprint from the previous page to fetch the next page.
        required: false
        schema:
          type: string
      - name: key
        in: query
        description: Filter to a single key.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Paginated blueprint catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBlueprintsResponse'
    post:
      tags:
      - blueprints
      operationId: create_blueprint
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBlueprintRequest'
        required: true
      responses:
        '201':
          description: Blueprint created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required (super-admin required for canonical blueprints)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Blueprint key already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /agents/blueprints/{reference}:
    get:
      tags:
      - blueprints
      operationId: get_blueprint
      parameters:
      - name: reference
        in: path
        description: Blueprint `blp_` id or key (e.g. `osm`)
        required: true
        schema:
          type: string
      - name: yaml
        in: query
        description: |-
          Controls the `yaml_document` in the response. Omitted: include the stored
          YAML if one exists. `true`: always include, generating it from the
          document when none is stored. `false`: never include.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: The blueprint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintResponse'
        '400':
          description: Invalid reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Blueprint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - blueprints
      operationId: delete_blueprint
      parameters:
      - name: reference
        in: path
        description: Blueprint `blp_` id or key (e.g. `osm`)
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Blueprint deleted
        '400':
          description: Invalid reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required (super-admin required for canonical blueprints)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Blueprint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Blueprint is still referenced by a bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /agents/bundle:
    get:
      tags:
      - bundle
      operationId: list_bundles
      parameters:
      - name: limit
        in: query
        description: Max entries to return (default 20, capped at 100).
        required: false
        schema:
          type: integer
          format: int64
      - name: after
        in: query
        description: |-
          Cursor: return bundles older than the one with this id. Pass the id of
          the last bundle from the previous page to fetch the next page.
        required: false
        schema:
          type: string
      - name: query
        in: query
        description: |-
          Case-insensitive substring match over the bundle name and id. Omit for
          no search filter.
        required: false
        schema:
          type: string
      - name: blueprint_id
        in: query
        description: Restrict to bundles pinning this blueprint (`blp_` id, exact match).
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Paginated bundle list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBundlesResponse'
    post:
      tags:
      - bundle
      operationId: create_bundle
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBundleRequest'
        required: true
      responses:
        '201':
          description: Bundle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundleResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Blueprint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /agents/bundle/{bundle_id}:
    get:
      tags:
      - bundle
      operationId: get_bundle
      parameters:
      - name: bundle_id
        in: path
        description: Bundle `bnd_` id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundleResponse'
        '404':
          description: Bundle not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - bundle
      operationId: delete_bundle
      parameters:
      - name: bundle_id
        in: path
        description: Bundle `bnd_` id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Bundle deleted
        '404':
          description: Bundle not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /agents/bundle/{bundle_id}/run:
    post:
      tags:
      - instances
      operationId: run_bundle
      parameters:
      - name: bundle_id
        in: path
        description: Bundle `bnd_` id to run
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunAgentRequest'
        required: true
      responses:
        '202':
          description: Run accepted; agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '404':
          description: Bundle not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /agents/instances:
    get:
      tags:
      - instances
      operationId: list_agents
      parameters:
      - name: limit
        in: query
        description: Max entries to return (default 20, capped at 100).
        required: false
        schema:
          type: integer
          format: int64
      - name: after
        in: query
        description: |-
          Cursor: return agents older than the one with this id. Pass the id of
          the last agent from the previous page to fetch the next page.
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Filter to a single lifecycle status (e.g. `running`). Omit for all statuses.
        required: false
        schema:
          $ref: '#/components/schemas/AgentStatus'
      - name: query
        in: query
        description: |-
          Case-insensitive substring match over the agent name, id, bundle id, and
          blueprint key. Omit for no search filter.
        required: false
        schema:
          type: string
      - name: bundle_id
        in: query
        description: Restrict to runs of this bundle (`bnd_` id, exact match).
        required: false
        schema:
          type: string
      - name: blueprint_id
        in: query
        description: Restrict to runs whose bundle pins this blueprint (`blp_` id, exact match).
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Paginated agent list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentsResponse'
  /agents/instances/{agent_id}:
    get:
      tags:
      - instances
      operationId: get_agent
      parameters:
      - name: agent_id
        in: path
        description: Agent `agt_` id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - instances
      operationId: delete_agent
      parameters:
      - name: agent_id
        in: path
        description: Agent `agt_` id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Agent deleted
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Agent is not in a terminal state (cancel it first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /agents/instances/{agent_id}/cancel:
    post:
      tags:
      - instances
      operationId: cancel_agent
      parameters:
      - name: agent_id
        in: path
        description: Agent `agt_` id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Agent already terminal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /agents/instances/{agent_id}/events:
    get:
      tags:
      - instances
      operationId: list_agent_events
      parameters:
      - name: agent_id
        in: path
        description: Agent `agt_` id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ordered audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentEventsResponse'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /agents/instances/{agent_id}/logs:
    get:
      tags:
      - instances
      operationId: get_agent_logs
      parameters:
      - name: offset
        in: query
        description: Items to skip (default 0).
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Max items to return (default 50, capped at 200).
        required: false
        schema:
          type: integer
          format: int64
      - name: agent_id
        in: path
        description: Agent `agt_` id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Run log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentLogsResponse'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /agents/instances/{agent_id}/pause:
    post:
      tags:
      - instances
      operationId: pause_agent
      parameters:
      - name: agent_id
        in: path
        description: Agent `agt_` id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Agent not running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /agents/instances/{agent_id}/results:
    get:
      tags:
      - instances
      operationId: get_agent_results
      parameters:
      - name: offset
        in: query
        description: Items to skip (default 0).
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Max items to return (default 50, capped at 200).
        required: false
        schema:
          type: integer
          format: int64
      - name: agent_id
        in: path
        description: Agent `agt_` id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Run output refs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResultsResponse'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /agents/instances/{agent_id}/resume:
    post:
      tags:
      - instances
      operationId: resume_agent
      parameters:
      - name: agent_id
        in: path
        description: Agent `agt_` id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Agent not paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /agents/nodes/registry:
    get:
      tags:
      - nodes
      operationId: list_registry
      responses:
        '200':
          description: Nodes in the configured registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRegistryResponse'
components:
  schemas:
    AgentEventResponse:
      type: object
      required:
      - level
      - message
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        level:
          $ref: '#/components/schemas/EventLevel'
        message:
          type: string
    AgentId:
      type: string
      description: TypeID-encoded identifier with 'AgentId' prefix
    AgentLogsResponse:
      type: object
      description: Run log entries, sourced from the executor (JOS job events; empty for noop).
      required:
      - data
      - total
      - offset
      - limit
      properties:
        data:
          type: array
          items: {}
        limit:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
          description: Total log entries available (this page may be a subset).
    AgentResponse:
      type: object
      required:
      - id
      - name
      - org_id
      - bundle_id
      - blueprint
      - blueprint_id
      - status
      - created_at
      properties:
        blueprint:
          type: string
          description: Human-readable pinned blueprint reference (its key), e.g. `osm`.
        blueprint_id:
          $ref: '#/components/schemas/BlueprintId'
          description: Immutable blueprint id the bundle pinned.
        bundle_id:
          $ref: '#/components/schemas/BundleId'
          description: The bundle this agent was run from (provenance).
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        connectors:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Connectors'
        created_at:
          type: string
          format: date-time
        error:
          type:
          - string
          - 'null'
        id:
          $ref: '#/components/schemas/AgentId'
        name:
          type: string
        org_id:
          $ref: '#/components/schemas/OrgId'
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          $ref: '#/components/schemas/AgentStatus'
    AgentResultsResponse:
      type: object
      description: Run output refs, sourced from the executor (JOS job outputs; empty for noop).
      required:
      - data
      - total
      - offset
      - limit
      properties:
        data:
          type: array
          items: {}
        limit:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
          description: Total outputs available (this page may be a subset).
    AgentStatus:
      type: string
      description: |-
        Agent lifecycle status. An agent exists only as a run, so status lives on
        the agent itself.

        ```text
          run a bundle
               │
               v
          ┌─────────┐   pause    ┌────────┐
          │ running │ ─────────> │ paused │──┐ cancel
          │         │ <───────── │        │  │
          └─────────┘   resume   └────────┘  │
               │                             │
               │             ┌───────────┐   │
               ├─── ok ────> │ completed │   │
               │             └───────────┘   │
               │                             │
               │             ┌────────┐      │
               ├─── error ─> │ failed │      │
               │             └────────┘      │
               │                             │
               │             ┌──────────┐    │
               └─── cancel > │ canceled │ <──┘
                             └──────────┘

          to re-run, run the bundle again -- each run is a new agent.
        ```
      enum:
      - running
      - paused
      - completed
      - failed
      - canceled
    BlueprintDto:
      type: object
      description: |-
        The on-disk shape of a blueprint, shared by the YAML and JSON (de)serializers.

        This is the public, serializable document format. Build a [`Blueprint`] from
        one with [`Blueprint::from_document`] (which resolves node keys against a
        [`NodeRegistry`]); it is also what [`Blueprint::from_json`]/[`from_yaml_string`]
        parse into internally.

        Nodes are split into two id-keyed maps: `connectors` (source/sink nodes) and
        `nodes` (everything else). [`Blueprint::from_document`] validates that each
        entry is in the right section. Both default to empty (a blueprint may have
        only connectors, e.g. a direct `source -> sink`).

        `blueprint_id` is optional: a document parses without one (an id is assigned
        when the blueprint is registered/stored).
      required:
      - graph
      properties:
        blueprint_id:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BlueprintId'
        bundles:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        connectors:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/NodeEntryDto'
          propertyNames:
            type: string
        description:
          type: string
        graph:
          $ref: '#/components/schemas/GraphDto'
        name:
          type: string
        nodes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/NodeEntryDto'
          propertyNames:
            type: string
        values: {}
    BlueprintId:
      type: string
      description: TypeID-encoded identifier with 'BlueprintId' prefix
    BlueprintResponse:
      type: object
      required:
      - id
      - blueprint_key
      - name
      - description
      - document
      - is_canonical
      - created_at
      properties:
        blueprint_key:
          type: string
        created_at:
          type: string
          format: date-time
        description:
          type: string
        document:
          $ref: '#/components/schemas/BlueprintDto'
          description: |-
            The blueprint document, in the `agent_core` shape — the same format
            accepted on create (see [`CreateBlueprintRequest`]), now carrying the
            assigned `blueprint_id`.
        id:
          $ref: '#/components/schemas/BlueprintId'
        is_canonical:
          type: boolean
          description: |-
            True for platform-authored (gallery) blueprints shared with every org;
            false for blueprints owned by a specific org.
        name:
          type: string
        yaml_document:
          type:
          - string
          - 'null'
          description: |-
            The YAML rendering of the blueprint, when included. Present when one was
            stored (or requested via `?yaml=true`); omitted otherwise. See the get
            endpoint's `yaml` query parameter.
    BlueprintSummary:
      type: object
      description: Catalog entry returned by the list endpoint — omits the full document.
      required:
      - id
      - blueprint_key
      - name
      - description
      - is_canonical
      - created_at
      properties:
        blueprint_key:
          type: string
        created_at:
          type: string
          format: date-time
        description:
          type: string
        id:
          $ref: '#/components/schemas/BlueprintId'
        is_canonical:
          type: boolean
          description: |-
            True for platform-authored (gallery) blueprints shared with every org;
            false for blueprints owned by a specific org.
        name:
          type: string
    BundleId:
      type: string
      description: TypeID-encoded identifier with 'BundleId' prefix
    BundleResponse:
      type: object
      required:
      - id
      - name
      - description
      - org_id
      - blueprint_id
      - values
      - status
      - created_at
      properties:
        artifacts: {}
        blueprint_id:
          $ref: '#/components/schemas/BlueprintId'
          description: |-
            The pinned blueprint's immutable `blp_` id. Resolve its key via the
            blueprint registry when needed.
        created_at:
          type: string
          format: date-time
        description:
          type: string
        id:
          $ref: '#/components/schemas/BundleId'
        model:
          type:
          - string
          - 'null'
        name:
          type: string
        org_id:
          $ref: '#/components/schemas/OrgId'
        status:
          $ref: '#/components/schemas/BundleStatus'
        values: {}
    BundleStatus:
      type: string
      description: |-
        Build lifecycle of a bundle. In Phase 1 a bundle is a DB entry built on
        create, so it is always `ready`; `building`/`failed` exist for the eventual
        image-build path.
      enum:
      - building
      - ready
      - failed
    Connectors:
      type: object
      description: |-
        Source/sink connectors binding a run's I/O. Bound at run time — I/O stays
        external to the agent ("build once, run anywhere").
      required:
      - source
      properties:
        sink:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DataRef'
            description: |-
              Optional output ref. Omitted (the default): the runner writes one output
              per input, named after the input. Provided: all output goes to this single
              file. Passed to the runner as the `output_ref` job-config key.
        source:
          type: array
          items:
            $ref: '#/components/schemas/DataRef'
          description: One or more input refs; multiple files are staged on the same JOS input port.
    CreateBlueprintRequest:
      type: object
      required:
      - blueprint_key
      properties:
        blueprint_key:
          type: string
          description: |-
            Human-readable key, e.g. `osm`. The reference users put in agent configs.
            A service-level catalog key (not part of the `agent_core` blueprint).
        canonical:
          type: boolean
          description: |-
            Set `true` to publish a platform-authored (gallery) blueprint visible to
            every org; this requires the super-admin grant. Defaults to `false`,
            registering it under the caller's org (which requires the admin role).
        document:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BlueprintDto'
            description: |-
              The blueprint document, in the `agent_core` shape. It carries the
              blueprint's own `name`/`description` and its `values`/`bundles`, the
              `connectors`/`nodes` id-keyed node maps, and a `graph` of edges. Any
              `blueprint_id` in the document is ignored — the service assigns one on
              store.

              Optional: provide this, or `yaml_document`, or both. When only
              `yaml_document` is given, the document is parsed from it. When both are
              given, they must describe the same blueprint.
        yaml_document:
          type:
          - string
          - 'null'
          description: |-
            A YAML rendering of the blueprint (the same shape as `document`). Stored
            verbatim so authored comments/formatting are preserved and returned by
            the get endpoint. When only this is provided, `document` is parsed from
            it; when both are provided, they must describe the same blueprint.
    CreateBundleRequest:
      type: object
      required:
      - blueprint
      - name
      properties:
        artifacts:
          description: 'Optional artifact links, e.g. `{"calibration": "s3://.../knn_index"}`.'
        blueprint:
          type: string
          description: 'Blueprint reference to pin: a `blp_` id or key (e.g. `osm`).'
        description:
          type: string
          description: Optional human description of this bundle. Defaults to an empty string.
        model:
          type:
          - string
          - 'null'
          description: Optional model override; omit to use the blueprint's default.
        name:
          type: string
          description: Human label for this bundle, e.g. `Pump A monitor`.
        values:
          description: |-
            User value overrides, layered over the blueprint defaults at run time.
            Must be a JSON object; defaults to `{}`.
    DataRef:
      type: object
      description: |-
        A reference to externally-stored data, bound at run time (I/O stays
        external to the agent — "build once, run anywhere").
      required:
      - type
      - id
      properties:
        format:
          type:
          - string
          - 'null'
          description: Optional format hint, e.g. `csv`.
        id:
          type: string
          description: Identifier within that storage kind, e.g. `file_abc123`.
        type:
          type: string
          description: Storage kind, e.g. `file` or `dataset`.
    EdgeDto:
      type: object
      required:
      - from
      - to
      properties:
        from:
          type: string
        to:
          type: string
    Error:
      type: object
      description: |-
        A single structured error entry matching the platform-wide API error standard.

        Serializes as:
        ```json
        {"code": "not_found", "message": "...", "suggestion": "...", "error_uid": "err-<uuid>"}
        ```
      required:
      - code
      - message
      - error_uid
      properties:
        code:
          type: string
        error_uid:
          type: string
        message:
          type: string
        suggestion:
          type:
          - string
          - 'null'
    ErrorResponse:
      type: object
      description: |-
        The standard API error response envelope.

        All API endpoints return errors in this shape:
        ```json
        {"errors": [{"code": "...", "message": "...", "suggestion": "...", "error_uid": "err-..."}]}
        ```
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    EventLevel:
      type: string
      description: Event severity for the agent event log.
      enum:
      - info
      - warning
      - error
    GraphDto:
      type: object
      properties:
        edges:
          type: array
          items:
            $ref: '#/components/schemas/EdgeDto'
    ListAgentEventsResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentEventResponse'
    ListAgentsResponse:
      type: object
      required:
      - data
      - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentResponse'
        has_more:
          type: boolean
          description: |-
            True when more results exist beyond this page (fetch them with
            `after = <id of the last item>`).
    ListBlueprintsResponse:
      type: object
      required:
      - data
      - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintSummary'
        has_more:
          type: boolean
          description: |-
            True when more results exist beyond this page (fetch them with
            `after = <id of the last item>`).
    ListBundlesResponse:
      type: object
      required:
      - data
      - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BundleResponse'
        has_more:
          type: boolean
          description: |-
            True when more results exist beyond this page (fetch them with
            `after = <id of the last item>`).
    NodeContractInfo:
      type: object
      description: A node's input and output ports (sorted by port name).
      required:
      - inputs
      - outputs
      properties:
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/PortInfo'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/PortInfo'
    NodeEntryDto:
      type: object
      description: |-
        One node/connector entry (the value of a `connectors`/`nodes` map; the map key
        is the node id).
      required:
      - key
      properties:
        config: {}
        key:
          type: string
    NodeInfo:
      type: object
      description: |-
        A single registered node: its key, description, port contract, and config
        schema/defaults.
      required:
      - key
      - description
      - contract
      - config_schema
      - default_config
      properties:
        config_schema:
          description: JSON Schema for the node's config (`{}` when the node takes no config).
        contract:
          $ref: '#/components/schemas/NodeContractInfo'
        default_config:
          description: The node's default config as a JSON object.
        description:
          type: string
        key:
          type: string
          description: The node key referenced from a blueprint's `connectors`/`nodes`.
    NodeRegistryResponse:
      type: object
      description: |-
        The nodes available in the configured `agent_core` registry, split into
        `connectors` (sources/sinks) and `nodes` (everything else). Each list is
        sorted by node key.
      required:
      - connectors
      - nodes
      properties:
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/NodeInfo'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeInfo'
    OrgId:
      type: string
      description: TypeID-encoded identifier with 'OrgId' prefix
    PortInfo:
      type: object
      description: One port of a node's contract.
      required:
      - name
      - type
      properties:
        name:
          type: string
        type:
          type: string
          description: The port's data type, e.g. `Record` or `Window`.
    RunAgentRequest:
      type: object
      description: |-
        Body of `POST /agents/bundle/{bundle_id}/run`: the I/O binding for this
        run. Parameters/model come from the bundle, not the run request.
      required:
      - connectors
      properties:
        connectors:
          $ref: '#/components/schemas/Connectors'
tags:
- name: blueprints
  description: Agent blueprint catalog
- name: bundle
  description: Deployable bundles built from blueprints
- name: instances
  description: Agent runs (instances of a bundle)
- name: nodes
  description: Node registry
