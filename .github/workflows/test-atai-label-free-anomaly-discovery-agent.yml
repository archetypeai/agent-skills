name: Test atai-label-free-anomaly-discovery-agent

on:
  pull_request:
    paths:
      - 'skills/atai-label-free-anomaly-discovery-agent/**'
      - '.github/workflows/test-atai-label-free-anomaly-discovery-agent.yml'
  push:
    branches: [main]
    paths:
      - 'skills/atai-label-free-anomaly-discovery-agent/**'
      - '.github/workflows/test-atai-label-free-anomaly-discovery-agent.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r skills/atai-label-free-anomaly-discovery-agent/references/requirements.txt pytest

      - name: Run pytest
        run: pytest skills/atai-label-free-anomaly-discovery-agent/tests/ -v
