name: Test atai-manual-generation-agent

on:
  pull_request:
    paths:
      - 'skills/atai-manual-generation-agent/**'
      - '.github/workflows/test-atai-manual-generation-agent.yml'
  push:
    branches: [main]
    paths:
      - 'skills/atai-manual-generation-agent/**'
      - '.github/workflows/test-atai-manual-generation-agent.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # the runner needs the official client; pytest runs the tests (unittest or pytest style)
        run: |
          python -m pip install --upgrade pip
          pip install -r skills/atai-manual-generation-agent/references/requirements.txt pytest

      - name: Run the network-free tests
        run: python -m pytest skills/atai-manual-generation-agent/tests -v
